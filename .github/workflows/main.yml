---
  name: Build and Push OR check-PR

  on:
    pull_request:
      branches:
        - main
    push:
      branches:
        - main
        - dev
      tags:
        - "*"
    workflow_dispatch:

  jobs:
    compile_sketch:
      name: Build ${{ matrix.board.board }}
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          board:
            - { # 1
                board: "esp32-4mb",
                env: [
                  "CYD-2432S022C",
                  "CYD-2432S032C",
                  "CYD-2432S032R",
                  "CYD-3248S035C",
                  "CYD-3248S035R",

                  "elecrow-24B",
                  "elecrow-28B",
                  "elecrow-35B",
                  "elecrow-35Bv2_2",
                  "headless-esp32-4mb",

                  "m5stack-core-4Mb"
                  ]
              }
            - { # 2
                board: "esp32-4mb",
                env: [
                  "CYD-2432W328R",
                  "CYD-2432S024R",
                  "CYD-2432W328C_2",
                  "CYD-2432W328C",
                  "CYD-2-USB",

                  "CYD-2432S028",
                  "m5stack-cplus1_1",
                  "m5stack-c",
                  "Marauder-Mini",
                  "Marauder-v7",

                  "Marauder-v4-OG",
                  "Marauder-v61",
                  "WaveSentry-R1",
                  "Phantom_S024R"
                  ]
              }
            - { # 3
                board: "esp32-8mb",
                env: [
                  "m5stack-cplus2",
                  "headless-esp32-8mb"
                  ]
              }
            - { # 4
                board: "esp32-16mb",
                env: [
                  "m5stack-core2",
                  "m5stack-core",
                  "Awok-Mini",
                  "Awok-Touch"
                  ]
              }
            - { # 5
                board: "esp32-16mb-psram",
                env: [
                  "m5stack-paper"
                  ]
              }
            - { # 6
                board: "ESP32S3-4M",
                env: [
                  "headless-esp32s3-4mb"
                  ]
              }
            - { # 7
                board: "esp32s3-8mb",
                env: [
                  "m5stack-cardputer",
                  "m5stack-dinmeter"
                  ]
              }
            - { # 8
                board: "esp32s3-8mb-psram",
                env: [
                  "m5stack-sticks3",
                  "headless-esp32s3-8mb"
                  ]
              }
            - { # 9
                board: "esp32s3-16mb-psram",
                env: [
                  "CYD-8048S043C",
                  "CYD-8048W550C",
                  "CYD-3248W535C",
                  "CYD-4827S043R",
                  "headless-esp32s3-16mb",

                  "lilygo-t-deck",
                  "lilygo-t-deck-plus",
                  "lilygo-t-deck-pro",
                  "lilygo-t-display-S3-pro",
                  "lilygo-t-display-S3-touch",

                  "lilygo-t-dongle-s3-tft",
                  ]
              }
            - { # 10
                board: "esp32s3-16mb-psram",
                env: [
                  "lilygo-t-embed",
                  "lilygo-t-embed-cc1101",
                  "lilygo-t-hmi",
                  "lilygo-t-lora-pager",
                  "lilygo-t-watch-s3",

                  "lilygo-t-watch-ultra",
                  "lilygo-t5-epaper-s3-pro",
                  "m5stack-cores3",
                  "m5stack-paper-s3",
                  "smoochiee-board",
                  # "lilygo-t-display-S3-amoled",
                  "waveshare-esp32-s3-lcd-147"
                  ]
              }
            - { # 11
                board: "esp32c6-16mb",
                env: ["arduino-nesso-n1"]
              }
            - { # 12
                board: "esp32p4-16mb-psram",
                env: ["m5stack-tab5"]
              }
            - { # 13
                board: "esp32c5-16mb-psram",
                env: ["NM-CYD-C5"]
              }

      steps:
          - uses: actions/checkout@v4
            with:
              submodules: true

          - id: build
            name: setup Python
            uses: actions/setup-python@v2
            with:
              python-version: "3.13"

          - name: Cache pip
            uses: actions/cache@v4
            with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
              restore-keys: |
                ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                ${{ runner.os }}-pip-

          - name: Cache PlatformIO Framework
            uses: actions/cache@v4
            with:
              path: |
                .pio/core
              key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
              restore-keys: |
                ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
                ${{ runner.os }}-platformio-

          - name: PIO libraries cache
            uses: actions/cache@v4
            with:
              path: |
                .pio/libdeps
              key: ${{ runner.os }}-pio-${{ matrix.board.board }}-${{ hashFiles('platformio.ini') }}
              restore-keys: |
                ${{ runner.os }}-pio-${{ matrix.board.board }}-${{ hashFiles('platformio.ini') }}
                ${{ runner.os }}-pio-${{ matrix.board.board }}-

          - name: Install dependencies
            run: |
              pip install requests esptool platformio

              if [[ "${{ github.ref_type }}" == "tag" ]]; then
                version=${{ github.ref_name }}
              else
                version="${GITHUB_SHA::7}"
              fi

              sed -i "s/-DLAUNCHER=/-DLAUNCHER='\"$version\"' ; /g" ./platformio.ini

          - name: Run Compile
            run: |
              set -euo pipefail
              python support_files/build.py --board "${{ matrix.board.board }}" --env ${{ join(matrix.board.env, ' ') }}

          - name: Upload Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: Artifacts-${{ matrix.board.board }}-${{ matrix.board.env[0] }}
              path: |
                Launcher-*.bin
              retention-days: 5
              if-no-files-found: error

    post_compile_steps:
      name: Post-compile steps
      runs-on: ubuntu-latest
      needs: compile_sketch
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') || github.ref_type == 'tag'
      steps:
        - uses: actions/checkout@v4
          with:
            ref: WebPage
            fetch-depth: 1

        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            path: ~/LauncherArtifacts

        - name: Move artifacts to the correct folders
          run: |
            set -x
            pwd
            mkdir -p artifacts
            cp -f ~/LauncherArtifacts/*/*.bin artifacts
            tree

        - name: Ensure releases exist and get IDs
          id: get_release
          uses: actions/github-script@v7
          with:
            script: |
              const ensureByTag = async (tag, prerelease=true) => {
                try {
                  const { data } = await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag
                  });
                  return data.id;
                } catch (e) {
                  if (e.status !== 404) throw e;
                  const { data } = await github.rest.repos.createRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_name: tag,
                    name: tag,
                    prerelease
                  });
                  return data.id;
                }
              };

              const betaId = await ensureByTag('beta');
              const lastId = await ensureByTag('last');

              core.setOutput('beta', String(betaId));
              core.setOutput('last', String(lastId));

        - name: Get current sha
          id: get_sha
          run: |
            echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

        - name: Delete old betaRelease assets
          uses: actions/github-script@v6
          with:
            script: |
              const release_id = ${{ steps.get_release.outputs.beta }};
              const assets = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id
              });
              for (const asset of assets.data) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }

        - name: Upload new beta asset
          uses: softprops/action-gh-release@v2
          with:
            name: betaRelease commit (${{ steps.get_sha.outputs.GITHUB_SHA_SHORT }})
            tag_name: beta
            files: artifacts/**
            fail_on_unmatched_files: false
            make_latest: false
            generate_release_notes: false

        - name: Delete old lastRelease assets
          uses: actions/github-script@v6
          if: github.ref_type == 'tag'
          with:
            script: |
              const release_id = ${{ steps.get_release.outputs.last }};
              const assets = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id
              });
              for (const asset of assets.data) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }

        - name: Upload new last asset
          uses: softprops/action-gh-release@v2
          if: github.ref_type == 'tag'
          with:
            name: lastRelease commit (${{ steps.get_sha.outputs.GITHUB_SHA_SHORT }})
            tag_name: last
            prerelease: true
            files: artifacts/**
            fail_on_unmatched_files: false
            make_latest: false
            generate_release_notes: false

        - name: Trigger WebPage deploy (workflow_dispatch)
          if: ${{ success() }}
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh workflow list
            gh workflow run .github/workflows/deploy.yml --ref WebPage

    create_release:
      runs-on: ubuntu-latest
      environment: github_release
      needs: [compile_sketch]
      if: github.ref_type == 'tag'
      steps:
      - id: launcher_version
        name: Get Version
        run: |
          set -x
          version=${{ github.ref_name }}
          echo "version=${version}" > $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List all files
        if: always()
        run: |
          set -x
          pwd
          ls -all
          tree

      - name: Create Release ${{ steps.launcher_version.outputs.version }}
        uses: softprops/action-gh-release@v1
        with:
          name: Launcher Release ${{ steps.launcher_version.outputs.version }}
          tag_name: ${{ steps.launcher_version.outputs.version }}
          generate_release_notes: true
          files: |
            Launcher-*.bin
