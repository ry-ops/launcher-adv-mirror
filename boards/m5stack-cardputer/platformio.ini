; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = m5stack-cardputer
board_build.partitions = support_files/custom_8Mb.csv
# board_build.partitions = support_files/custom_8Mb2.csv # debug
; launcher-adv-mirror ADR 0001: the mirror core (a submodule, never hand-
; edited -- see ADR 0005) and this project's one adapter file, both scoped
; to this env only. lib_modules/CardputerMirror is the WHOLE submoduled
; repo (its own src/ is a standalone example app, not wanted here), so this
; points at the nested library dir directly rather than relying on
; lib_extra_dirs' top-level auto-discovery, same reasoning as the
; boards/m5stack-cardputer entry it sits next to below.
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer> +<../adapters/launcher> +<../lib_modules/CardputerMirror/lib/CardputerMirror>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cardputer
	-Iadapters/launcher
	-Ilib_modules/CardputerMirror/lib/CardputerMirror
	; AsyncTCP (esp32async/ESPAsyncWebServer's dependency, pulled in by
	; CardputerMirror) defaults to assuming the ESP-IDF task watchdog is
	; available (CONFIG_ASYNC_TCP_USE_WDT=1 unless told otherwise) and then
	; needs CONFIG_ESP_TASK_WDT_TIMEOUT_S from it. Launcher's custom
	; framework-arduinoespressif32-libs build has no task-watchdog config at
	; all (checked: no CONFIG_ESP_TASK_WDT* anywhere in its sdkconfig.h), so
	; that default doesn't hold here. This is AsyncTCP's own supported
	; escape hatch for builds without WDT support, not a workaround.
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DOTA_TAG='"cardputer"'

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCARDPUTER=1
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000
	'-DRESERVED_NAV_KEYS=",\;/\`."'

	-DROTATION=1
	-DHAS_BTN=1
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	-DFP=1
	-DFM=2
	-DFG=3
	-DANALOG_BAT_PIN=10
	-DLED=21
	-DLED_ON=HIGH
	-DBACKLIGHT=38
	-DMINBRIGHT=165

	-DTCA8418_INT_PIN=11
	-DTCA8418_I2C_ADDR=0x34
	-DTCA8418_SDA_PIN=8
	-DTCA8418_SCL_PIN=9

	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37

	-D GFX_BL=38
	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_SPI_BUS=FSPI
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.1
	esp32async/ESPAsyncWebServer@^3.12.0

lib_ignore =
	SensorLib
	XPowersLib
	; PlatformIO's own lib_extra_dirs auto-discovery (root [env] block) treats
	; every lib_modules/* subdirectory as a candidate library using ITS OWN
	; src/ as the source root. For the CardputerMirror submodule that's the
	; standalone example app (main.cpp/keyinject.cpp/menu.cpp), not the
	; library -- the real library is explicitly pulled in above via
	; build_src_filter + -I pointing at lib_modules/CardputerMirror/lib/
	; CardputerMirror directly. Without this, both paths compile at once and
	; the standalone example's own main()/keyinject/menu collide with
	; Launcher's.
	CardputerMirror
